<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carta de Amor 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Dancing Script', cursive;
    background: pink;
    overflow-x: hidden;
    text-align: center;
}

/* CORAZONES */
.corazon {
    position: fixed;
    top: -10px;
    color: red;
    animation: caer 5s linear infinite;
}
@keyframes caer {
    to { transform: translateY(100vh); }
}

/* SOBRE */
.sobre {
    width: 300px;
    height: 200px;
    background: #fff;
    margin: 20px auto;
    cursor: pointer;
    position: relative;
    border-radius: 10px;
}

.carta {
    display: none;
    padding: 15px;
}

.abierto .carta {
    display: block;
}

/* BOTONES */
button {
    background: #ff6b81;
    color: white;
    border: none;
    padding: 10px;
    margin: 10px;
    border-radius: 20px;
    cursor: pointer;
}

/* GALERÍA */
#galeria img {
    width: 80px;
    margin: 5px;
    border: 3px solid pink;
    border-radius: 10px;
}

/* BORDES */
.floral1 { border: 5px dashed hotpink; }
.floral2 { border: 5px solid red; }

/* MAPA */
iframe {
    width: 90%;
    height: 200px;
    border: none;
    border-radius: 10px;
}
</style>
</head>

<body>

<h2>Para mi amor 💖</h2>

<!-- SOBRE -->
<div class="sobre" onclick="abrirCarta(this)">
    <div class="carta">
        <textarea id="textoInput" placeholder="Escribe tu mensaje..." rows="4" style="width:90%"></textarea>
        <p id="mensaje"></p>
        <button onclick="mostrarMensaje()">Mostrar mensaje</button>
    </div>
</div>

<!-- MÚSICA -->
<button onclick="toggleMusica()">🎻 Música</button>
<audio id="musica" loop>
<source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3">
</audio>

<!-- GALERÍA -->
<h3>📸 Nuestros recuerdos</h3>
<input type="file" multiple onchange="cargarFotos(event)">
<div id="galeria" class="floral1"></div>

<select onchange="cambiarBorde(this.value)">
<option value="floral1">🌸 Borde floral 1</option>
<option value="floral2">🌹 Borde floral 2</option>
</select>

<!-- CUENTA REGRESIVA -->
<h3>⏳ Cuenta regresiva</h3>
<input type="date" id="fecha">
<p id="contador"></p>

<!-- POEMA -->
<button onclick="poema()">💌 Generar poema</button>
<p id="poema"></p>

<!-- SELLO -->
<h3>💌 Sello de cera</h3>
<select onchange="cambiarSello(this.value)">
<option value="❤️">❤️ Amor</option>
<option value="💋">💋 Beso</option>
<option value="💍">💍 Compromiso</option>
</select>
<p id="sello" style="font-size:30px;">❤️</p>

<!-- MAPA -->
<h3>📍 Nuestro lugar especial</h3>
<iframe src="https://maps.google.com/maps?q=19.495,-99.126&z=15&output=embed"></iframe>

<script>

/* CORAZONES */
setInterval(()=>{
    let c = document.createElement("div");
    c.className="corazon";
    c.innerHTML="❤️";
    c.style.left=Math.random()*100+"%";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),5000);
},300);

/* SOBRE */
function abrirCarta(el){
    el.classList.toggle("abierto");
}

/* MENSAJE */
function mostrarMensaje(){
    let texto = document.getElementById("textoInput").value;
    let i=0;
    let salida="";
    let intervalo=setInterval(()=>{
        salida+=texto[i];
        document.getElementById("mensaje").innerHTML=salida;
        i++;
        if(i>=texto.length) clearInterval(intervalo);
    },40);
}

/* MÚSICA */
function toggleMusica(){
    let m=document.getElementById("musica");
    m.paused ? m.play() : m.pause();
}

/* GALERÍA */
function cargarFotos(e){
    let galeria=document.getElementById("galeria");
    galeria.innerHTML="";
    Array.from(e.target.files).forEach(file=>{
        let img=document.createElement("img");
        img.src=URL.createObjectURL(file);
        galeria.appendChild(img);
    });
}

/* BORDE */
function cambiarBorde(tipo){
    let g=document.getElementById("galeria");
    g.className=tipo;
}

/* CUENTA REGRESIVA */
setInterval(()=>{
    let fecha=document.getElementById("fecha").value;
    if(!fecha) return;
    let futuro=new Date(fecha);
    let hoy=new Date();
    let diff=futuro-hoy;
    let dias=Math.floor(diff/(1000*60*60*24));
    document.getElementById("contador").innerText=dias+" días 💖";
},1000);

/* POEMA */
function poema(){
    let poemas=[
        "Eres mi sueño hecho realidad 💖",
        "Contigo todo es magia ✨",
        "Tu amor es mi hogar ❤️"
    ];
    document.getElementById("poema").innerText=
        poemas[Math.floor(Math.random()*poemas.length)];
}

/* SELLO */
function cambiarSello(s){
    document.getElementById("sello").innerText=s;
}

</script>

</body>
</html>
